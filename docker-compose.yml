# LEGAL FLOW — sobe API, painel e n8n com:  docker compose up -d --build
#   Painel:  http://localhost:8501
#   API:     http://localhost:8000/docs
#   n8n:     http://localhost:5678

x-legalflow-env: &legalflow-env
  LEGALFLOW_DADOS: /dados
  TZ: America/Sao_Paulo
  TEAMS_WEBHOOK_PADRAO: ${TEAMS_WEBHOOK_PADRAO:-}
  LEGALFLOW_URL_PAINEL: ${LEGALFLOW_URL_PAINEL:-http://localhost:8501}
  LEGALFLOW_DIAS_ALERTA: ${LEGALFLOW_DIAS_ALERTA:-3}
  LEGALFLOW_HORAS_REPETICAO_VENCIDA: ${LEGALFLOW_HORAS_REPETICAO_VENCIDA:-24}
  LEGALFLOW_HORAS_PRAZO_A_DEFINIR: ${LEGALFLOW_HORAS_PRAZO_A_DEFINIR:-24}

services:
  api:
    build: .
    command: uvicorn legalflow.api:app --host 0.0.0.0 --port 8000
    environment: *legalflow-env
    volumes:
      - dados:/dados
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  painel:
    build: .
    command: streamlit run painel/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment:
      <<: *legalflow-env
      # O painel envia "Nova demanda" pelo mesmo webhook que os formulários/e-mails usam.
      LEGALFLOW_N8N_WEBHOOK: http://n8n:5678/webhook/nova-demanda
    volumes:
      - dados:/dados
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Importa (ou atualiza) os workflows de n8n/workflows e os ativa; depois encerra.
  n8n-importar:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSAO:-1.123.93}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - n8n import:workflow --separate --input=/workflows && n8n update:workflow --all --active=true
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
    volumes:
      - n8n_dados:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSAO:-1.123.93}
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - n8n_dados:/home/node/.n8n
    ports:
      - "5678:5678"
    depends_on:
      n8n-importar:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dados:
  n8n_dados:
